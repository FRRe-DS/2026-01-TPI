# nginx para el front: sirve los archivos que genera "npm run build".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta que no sea un archivo devuelve index.html (la app es una sola página)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de assets/ llevan un hash en el nombre: el navegador los puede guardar mucho tiempo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
