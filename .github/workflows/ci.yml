# Integración continua (RNF-17): en cada push y en cada PR corre las pruebas de la API
# y verifica que el front compile. Si algo falla, GitHub lo marca en el commit y en el PR.
name: CI

on:
  push:
    branches: [main, desarrollo-m2, "feature/**"]
  pull_request:
    branches: [main, desarrollo-m2]

# Un push nuevo a la misma rama cancela la corrida anterior, que ya no sirve
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Pruebas de la API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m2-clientes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            m2-clientes/requirements.txt
            m2-clientes/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      # No necesitan MongoDB ni Keycloak: usan una base en memoria y tokens de prueba,
      # y validan cada respuesta contra contratos/m2_clientes/openapi.yml
      - name: Correr las pruebas
        run: python -m pytest -q

  front:
    name: Build del front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
